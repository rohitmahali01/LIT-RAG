# nixpacks.toml

[phases.setup]
# Install these with apt-get inside the build image
aptPkgs = [
  "libmagic-dev",
  "poppler-utils",
  "tesseract-ocr",       # base engine
  "tesseract-ocr-all",   # all language packs (optional & large)
  "libreoffice",         # full suite; use libreoffice-headless if CLI-only
  "pandoc",
  "libgl1",              # OpenGL runtime
  "libglx-mesa0",         # replaces the old libgl1-mesa-glx package
  "libgl1-mesa-glx",    
  "libglib2.0-0"
]
